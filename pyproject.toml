[project]
name = "ugv-rpi"
version = "0.1.0"
description = "Universal Ground Vehicle software for Raspberry Pi"
authors = [
    {name = "Viktor Nizhenets",email = "nontxt.steam@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiortc (>=1.14.0,<2.0.0)",
    "depthai (>=3.1.0,<4.0.0)",
    "flask (>=3.1.2,<4.0.0)",
    "flask-socketio (>=5.5.1,<6.0.0)",
    "imageio (==2.33.1)",
    "imutils (==0.5.4)",
    "jupyterlab (==4.0.8)",
    "mediapipe (==0.10.9)",
    "netifaces (==0.11.0)",
    "opencv-python (==4.9.0.80)",
    "picamera2 (>=0.3.31,<0.4.0)",
    "psutil (==5.9.4)",
    "pygame (>=2.6.1,<3.0.0)",
    "pyserial (==3.5)",
    "pyttsx3 (==2.7)",
    "pyyaml (==6.0.1)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false